openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: profile
    description: User profile operations
  - name: materials
    description: Study material operations
  - name: groups
    description: Study group operations
  - name: quiz
    description: Quiz operations
  - name: shop
    description: Shop and inventory operations
  - name: tickets
    description: Support ticket operations
  - name: social
    description: Social and invite operations
  - name: leaderboard
    description: Global leaderboard
  - name: labs
    description: Interactive lab exercises and attempts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
        A pending_uploads row is inserted for later verification; ACL is set
        only after the object is confirmed to exist in POST /materials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR (requires auth + owner check)
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user profile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: upsertProfile
      tags: [profile]
      summary: Upsert current user profile (create on first call)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfileRequest"
      responses:
        "200":
          description: Profile upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /profile/labs-enabled:
    patch:
      operationId: setLabsEnabled
      tags: [profile]
      summary: Enable or disable labs for this user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLabsEnabledRequest"
      responses:
        "200":
          description: Labs preference updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /profile/level:
    patch:
      operationId: updateLevel
      tags: [profile]
      summary: Update user level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLevelRequest"
      responses:
        "200":
          description: Level updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /materials:
    get:
      operationId: listMaterials
      tags: [materials]
      summary: List materials owned by current user
      responses:
        "200":
          description: List of materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: finalizeMaterial
      tags: [materials]
      summary: Finalize material metadata after successful upload
      description: |
        Verifies a pending upload row owned by current user exists and is unexpired,
        confirms the object exists in storage with matching metadata/size,
        sets private ACL, inserts material record, and consumes the pending row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeMaterialRequest"
      responses:
        "201":
          description: Material created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden (pending row not owned by current user or groupId not owned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Pending upload not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Upload already finalized or object already added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /materials/{materialId}/retry-analysis:
    parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: retryMaterialAnalysis
      tags: [materials]
      summary: Retry extraction or transcription for a material
      responses:
        "200":
          description: Analysis queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          description: Material cannot be analyzed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Material not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Analysis already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /materials/{materialId}:
    delete:
      operationId: deleteMaterial
      tags: [materials]
      summary: Delete a material (owner only) and remove underlying object
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List study groups the current user is a member of
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyGroup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a study group (also finalizes group metadata after upload)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroup"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /groups/{groupId}/join:
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Join a study group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Joined group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /quiz/sessions:
    post:
      operationId: startQuizSession
      tags: [quiz]
      summary: Start a server-scored quiz session
      description: |
        Creates a quiz session for an owned material. Returns questions without
        correctIndex. The server stores the answer key internally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartQuizSessionRequest"
      responses:
        "201":
          description: Quiz session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSessionResponse"
        "400":
          description: Validation error (invalid materialId or totalQuestions)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Material not owned by current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Material not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: >
            One or more selected materials are not ready for study (unsupported
            format, extraction failed, or not enough extractable text).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /study/flashcards:
    post:
      operationId: generateFlashcards
      tags: [quiz]
      summary: Generate content-grounded flashcards from owned, ready materials
      description: |
        Verifies all selected materials are owned and extractionStatus=ready with
        meaningful extracted text, then returns flashcards grounded in the actual
        content. Generated separately from quiz answer keys. No filename fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardsRequest"
      responses:
        "200":
          description: Flashcards generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardsResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: One or more materials not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: One or more materials not ready for study
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /study/recovery:
    get:
      operationId: getRecoverySummary
      tags: [quiz]
      summary: List unanswered concepts from previous incorrect quiz answers
      responses:
        "200":
          description: Recovery queue for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverySummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /study/recovery/sessions:
    post:
      operationId: startRecoverySession
      tags: [quiz]
      summary: Start a targeted quiz with unresolved incorrect answers only
      responses:
        "201":
          description: Recovery quiz session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSessionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: No unresolved errors exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /study/explanations:
    post:
      operationId: getQuickExplanation
      tags: [quiz]
      summary: Buy a concise AI concept explanation for one quiz question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickExplanationRequest"
      responses:
        "200":
          description: Explanation generated or already purchased for this question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickExplanationResponse"
        "400":
          description: Invalid request or insufficient points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Quiz session or question not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: AI explanation temporarily unavailable; no points charged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /quiz/sessions/{sessionId}/complete:
    post:
      operationId: completeQuizSession
      tags: [quiz]
      summary: Complete a quiz session and award coins (idempotent)
      description: |
        Accepts the user's answers array, scores against the server answer key,
        inserts one attempt record, awards wallet coins, and marks session complete.
        Idempotent: same idempotencyKey on a completed session returns the existing
        attempt without re-awarding coins. Different key on completed session
        returns existing attempt without re-awarding.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteQuizSessionRequest"
      responses:
        "200":
          description: Session completed (or already completed — returns existing attempt)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttempt"
        "400":
          description: Validation error (wrong answer array length, expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Session not owned by current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Session already completed but attempt record unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /quiz/attempts:
    get:
      operationId: listQuizAttempts
      tags: [quiz]
      summary: List quiz attempts for the current user
      responses:
        "200":
          description: List of attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizAttempt"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /shop/buy:
    post:
      operationId: buyShopItem
      tags: [shop]
      summary: Purchase a shop item (server validates price from catalog)
      description: |
        Only itemId is accepted. Server looks up price and type from the server-side
        catalog. Duplicate purchases return 409. Insufficient funds return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyShopItemRequest"
      responses:
        "200":
          description: Item purchased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedShopItem"
        "400":
          description: Validation error, unknown item, or insufficient funds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Item already owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /shop/equip:
    post:
      operationId: equipShopItem
      tags: [shop]
      summary: Equip an owned shop item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipShopItemRequest"
      responses:
        "200":
          description: Item equipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedShopItem"
        "400":
          description: Item not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /shop/themes/use-light:
    post:
      operationId: useLightTheme
      tags: [shop]
      summary: Return to the free light theme
      responses:
        "204":
          description: All equipped theme rewards were removed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /labs/exercises:
    get:
      operationId: listLabExercises
      tags: [labs]
      summary: List lab exercises for the current user's study path
      responses:
        "200":
          description: Lab exercises
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabExercisesResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Labs not enabled for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /labs/exercises/{id}:
    get:
      operationId: getLabExercise
      tags: [labs]
      summary: Get a single lab exercise by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lab exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabExercise"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Labs not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /labs/attempts:
    post:
      operationId: submitLabAttempt
      tags: [labs]
      summary: Submit an answer to a lab exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabAttemptRequest"
      responses:
        "201":
          description: Attempt result with score, feedback and earned points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabAttemptResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Labs not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      operationId: listLabAttempts
      tags: [labs]
      summary: List the current user's lab attempt history
      responses:
        "200":
          description: List of attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LabAttemptHistory"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /shop/inventory:
    get:
      operationId: getInventory
      tags: [shop]
      summary: Get owned/equipped shop items for current user
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnedShopItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List tickets for current user
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tickets/{ticketId}/read:
    patch:
      operationId: markTicketRead
      tags: [tickets]
      summary: Mark a support ticket response as read
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [tickets]
      summary: List users for the private support console
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Administrator role required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /admin/tickets:
    get:
      operationId: listAdminTickets
      tags: [tickets]
      summary: List support tickets for the private console
      responses:
        "200":
          description: Tickets with conversation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTicket"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Administrator role required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /admin/tickets/{ticketId}/reply:
    post:
      operationId: replyToAdminTicket
      tags: [tickets]
      summary: Reply to or close a support ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTicketReplyRequest" }
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400":
          description: Invalid reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Administrator role required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Ticket not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Global leaderboard (username and wallet only)
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /social/invite:
    get:
      operationId: getInviteSummary
      tags: [social]
      summary: Get invite code and friends summary for current user
      responses:
        "200":
          description: Invite summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /social/use-invite:
    post:
      operationId: useInviteCode
      tags: [social]
      summary: Use an invite code to connect with a friend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseInviteCodeRequest"
      responses:
        "200":
          description: Invite used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteSummary"
        "400":
          description: Invalid code or self-invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    Profile:
      type: object
      required: [userId, username, wallet, streak, inviteCode, labsEnabled, createdAt, updatedAt]
      properties:
        userId:
          type: string
        username:
          type: string
        level:
          type: string
          nullable: true
          description: Full Italian study-path string (e.g. "Liceo Scientifico"). Null before onboarding.
        wallet:
          type: integer
        streak:
          type: integer
        inviteCode:
          type: string
        avatarObjectPath:
          type: string
          nullable: true
        labsEnabled:
          type: boolean
          description: Whether labs are enabled for this user (true by default for STEM paths).
        hasLabsByDefault:
          type: boolean
          description: Whether this study path has labs enabled by default.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SetLabsEnabledRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    UpsertProfileRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 32
        email:
          type: string
          format: email

    UpdateLevelRequest:
      type: object
      required: [level]
      properties:
        level:
          type: string
          minLength: 1
          description: Full Italian study-path string (e.g. "Liceo Scientifico").

    Material:
      type: object
      required:
        - id
        - ownerId
        - title
        - contentType
        - objectPath
        - extractionStatus
        - extractionMessage
        - isStudyReady
        - createdAt
      properties:
        id:
          type: string
        ownerId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        contentType:
          type: string
        objectPath:
          type: string
        size:
          type: integer
          nullable: true
          description: File size in bytes.
        groupId:
          type: string
          nullable: true
        extractionStatus:
          type: string
          enum: [ready, unsupported, failed, pending, processing]
          description: >
            Readiness of the extracted study text. Raw extracted text is never
            exposed. 'ready' means usable for quizzes/flashcards.
        extractionMessage:
          type: string
          description: Safe Italian readiness message (never the extracted text).
        isStudyReady:
          type: boolean
          description: True when extractionStatus is 'ready'.
        createdAt:
          type: string
          format: date-time

    FinalizeMaterialRequest:
      type: object
      required: [contentType, objectPath, size]
      properties:
        title:
          type: string
          minLength: 1
          description: Ignored by the server; the saved title is generated from the uploaded content.
        description:
          type: string
        contentType:
          type: string
        objectPath:
          type: string
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        groupId:
          type: string

    StudyGroup:
      type: object
      required: [id, name, ownerId, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        ownerId:
          type: string
        coverObjectPath:
          type: string
          nullable: true
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
        coverObjectPath:
          type: string

    QuizQuestion:
      type: object
      required: [question, options]
      properties:
        question:
          type: string
        options:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 4

    StartQuizSessionRequest:
      type: object
      required: [materialIds, totalQuestions]
      properties:
        materialIds:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 20
          description: Owned material ids to combine into one unified quiz.
        totalQuestions:
          type: integer
          enum: [10, 20, 30]
        variant:
          type: string
          maxLength: 120
          description: Optional client-generated nonce used to request a fresh question variant.

    QuizSessionResponse:
      type: object
      required: [sessionId, questions, expiresAt]
      properties:
        sessionId:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
        expiresAt:
          type: string
          format: date-time

    CompleteQuizSessionRequest:
      type: object
      required: [answers, idempotencyKey]
      properties:
        answers:
          type: array
          items:
            type: integer
            nullable: true
          description: Array of selected option indices (null = unanswered). Length must equal totalQuestions.
        idempotencyKey:
          type: string
          minLength: 1

    QuizAttempt:
      type: object
      required: [id, userId, materialId, score, totalQuestions, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        materialId:
          type: string
        score:
          type: integer
        totalQuestions:
          type: integer
        earnedCoins:
          type: integer
        createdAt:
          type: string
          format: date-time

    FlashcardsRequest:
      type: object
      required: [materialIds]
      properties:
        materialIds:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 20
          description: Owned, study-ready material ids.
        variant:
          type: string
          maxLength: 120
          description: Optional client-generated nonce used to request a fresh flashcard variant.

    Flashcard:
      type: object
      required: [front, back, materialTitle]
      properties:
        front:
          type: string
        back:
          type: string
        materialTitle:
          type: string

    FlashcardsResponse:
      type: object
      required: [flashcards]
      properties:
        flashcards:
          type: array
          items:
            $ref: "#/components/schemas/Flashcard"

    RecoveryItem:
      type: object
      required: [id, materialId, question, timesMissed, lastWrongAt]
      properties:
        id:
          type: string
        materialId:
          type: string
        question:
          type: string
        timesMissed:
          type: integer
        lastWrongAt:
          type: string
          format: date-time

    RecoverySummary:
      type: object
      required: [pendingCount, items]
      properties:
        pendingCount:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryItem"

    QuickExplanationRequest:
      type: object
      required: [sessionId, questionIndex]
      properties:
        sessionId:
          type: string
        questionIndex:
          type: integer
          minimum: 0

    QuickExplanationResponse:
      type: object
      required: [explanation, chargedPoints, remainingPoints]
      properties:
        explanation:
          type: string
        chargedPoints:
          type: integer
        remainingPoints:
          type: integer

    OwnedShopItem:
      type: object
      required: [id, userId, itemId, itemType, equipped, purchasedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        itemId:
          type: string
        itemType:
          type: string
        equipped:
          type: boolean
        purchasedAt:
          type: string
          format: date-time

    BuyShopItemRequest:
      type: object
      required: [itemId]
      properties:
        itemId:
          type: string

    EquipShopItemRequest:
      type: object
      required: [ownedItemId]
      properties:
        ownedItemId:
          type: string

    Ticket:
      type: object
      required: [id, userId, subject, category, message, status, createdAt, updatedAt, messages]
      properties:
        id:
          type: string
        userId:
          type: string
        subject:
          type: string
        category:
          type: string
          description: Ticket category (e.g. "bug", "domanda", "altro").
        message:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
        unread:
          type: boolean
        closedAt:
          type: string
          format: date-time
          nullable: true
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TicketMessage"

    TicketMessage:
      type: object
      required: [id, ticketId, authorId, authorRole, message, createdAt]
      properties:
        id: { type: string }
        ticketId: { type: string }
        authorId: { type: string }
        authorRole: { type: string, enum: [user, admin] }
        message: { type: string }
        createdAt: { type: string, format: date-time }

    AdminUser:
      type: object
      required: [userId, username, email, createdAt]
      properties:
        userId: { type: string }
        username: { type: string }
        email: { type: string }
        level: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    AdminTicket:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required: [user]
          properties:
            user:
              allOf:
                - $ref: "#/components/schemas/AdminUser"
              nullable: true

    AdminTicketReplyRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 2, maxLength: 4000 }
        close: { type: boolean, default: false }

    CreateTicketRequest:
      type: object
      required: [subject, category, message]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 128
        category:
          type: string
          minLength: 1
          description: Ticket category (e.g. "bug", "domanda", "altro").
        message:
          type: string
          minLength: 1

    LeaderboardEntry:
      type: object
      required: [username, wallet]
      properties:
        username:
          type: string
        wallet:
          type: integer

    InviteSummary:
      type: object
      required: [inviteCode, friends]
      properties:
        inviteCode:
          type: string
        friends:
          type: array
          items:
            $ref: "#/components/schemas/FriendEntry"

    FriendEntry:
      type: object
      required: [username]
      properties:
        username:
          type: string
        level:
          type: string
          nullable: true
          description: Full Italian study-path string. Null before onboarding.

    UseInviteCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6

    LabExercise:
      type: object
      required: [id, subject, topic, title, prompt, exerciseType, difficultyLevel, points]
      properties:
        id:
          type: string
        subject:
          type: string
        topic:
          type: string
        title:
          type: string
        prompt:
          type: string
        exerciseType:
          type: string
          enum: [multiple_choice, free_text]
        options:
          type: array
          nullable: true
          items:
            type: string
        difficultyLevel:
          type: string
          enum: [base, medio, avanzato]
        points:
          type: integer

    LabExercisesResponse:
      type: object
      required: [hasLabsByDefault, labsEnabled, exercises]
      properties:
        hasLabsByDefault:
          type: boolean
        labsEnabled:
          type: boolean
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/LabExercise"

    LabAttemptRequest:
      type: object
      required: [exerciseId, userAnswer]
      properties:
        exerciseId:
          type: string
        userAnswer:
          type: string
          description: For multiple_choice, the string representation of the chosen option index (e.g. "2"). For free_text, the student's written answer.

    LabAttemptResult:
      type: object
      required: [id, exerciseId, score, feedback, earnedPoints, totalPoints, createdAt]
      properties:
        id:
          type: string
        exerciseId:
          type: string
        score:
          type: number
          description: 0.0 = wrong, 0.5 = partial, 1.0 = correct
        feedback:
          type: string
        solution:
          type: string
          description: Soluzione completa mostrata dopo una risposta parziale o errata
        earnedPoints:
          type: integer
        totalPoints:
          type: integer
        createdAt:
          type: string
          format: date-time

    LabAttemptHistory:
      type: object
      required: [id, exerciseId, userAnswer, score, feedback, earnedPoints, createdAt, exerciseTitle, exerciseSubject, exerciseTopic]
      properties:
        id:
          type: string
        exerciseId:
          type: string
        userAnswer:
          type: string
        score:
          type: number
        feedback:
          type: string
        earnedPoints:
          type: integer
        createdAt:
          type: string
          format: date-time
        exerciseTitle:
          type: string
        exerciseSubject:
          type: string
        exerciseTopic:
          type: string
