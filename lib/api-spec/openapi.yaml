        id:
          type: string
        userId:
          type: string
        itemId:
          type: string
        itemType:
          type: string
        equipped:
          type: boolean
        purchasedAt:
          type: string
          format: date-time

    BuyShopItemRequest:
      type: object
      required: [itemId]
      properties:
        itemId:
          type: string

    EquipShopItemRequest:
      type: object
      required: [ownedItemId]
      properties:
